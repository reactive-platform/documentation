name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      - name: Build the site
        run: docker build --target site --tag reactive-docs .

      - name: Replace the running site
        run: |
          docker rm --force reactive-docs || true
          docker run --detach \
            --name reactive-docs \
            --restart unless-stopped \
            --publish 127.0.0.1:3000:3000 \
            reactive-docs
          docker image prune --force
