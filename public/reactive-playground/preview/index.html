<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Reactive preview</title>
    <style>
        @font-face {
            font-family: Teko;
            font-weight: 500;
            src: url('./fonts/teko-medium.woff2') format('woff2');
        }

        html, body, #root { height: 100%; margin: 0; overflow: hidden; }
        body { background: #101014; user-select: none; }
        #root { position: relative; }
        .node { position: absolute; box-sizing: border-box; pointer-events: none; }
        .sprite, .fill, .text { position: absolute; inset: 0; pointer-events: none; }
        .sprite { width: 100%; height: 100%; }
        .text { display: flex; }
        .measure { position: absolute; visibility: hidden; white-space: pre; }
    </style>
</head>
<body>
<div id="root"></div>
<script type="module" src="./preview.js"></script>
</body>
</html>
