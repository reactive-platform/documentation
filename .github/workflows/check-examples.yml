name: Check examples

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: check-examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-examples:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      - name: Build the toolchain image
        run: docker build --target toolchain --tag reactive-docs-ci - < Dockerfile

      - name: Build the Playground and compile the examples
        # The runner uses rootless Docker, where root in the container is the runner user on the host
        run: |
          mkdir -p "$HOME/.cache/reactive-docs-ci"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            --volume "$HOME/.cache/reactive-docs-ci:/cache" \
            --env HOME=/cache \
            reactive-docs-ci \
            sh -c 'yarn install --frozen-lockfile && yarn build:playground && yarn check:examples'
